[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "content-discovery-and-capture"
version = "0.1.0"
description = "Local, checkpointed discovery and selective capture of Web and Filesystem sources"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
documents = ["python-docx>=1.1,<2", "python-pptx>=1,<2", "pdfplumber>=0.11,<1"]
images = ["Pillow>=10,<13"]
transcription = ["faster-whisper>=1.2,<2"]
browser = ["playwright>=1.50,<2"]

[project.scripts]
content-capture = "content_discovery_capture.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
content_discovery_capture = ["runtimes/*.js"]
